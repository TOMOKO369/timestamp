<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI タイムスタンプ生成ツール</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --primary: #ef4444; /* Red-500 */
            --primary-hover: #dc2626; /* Red-600 */
            --text-main: #334155; /* Slate-700 */
            --text-muted: #64748b; /* Slate-500 */
            --card-bg: rgba(255, 255, 255, 0.9);
            --border-color: rgba(239, 68, 68, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', 'Noto Sans JP', sans-serif;
            /* 赤と白のギンガムチェック（Gingham Check） */
            background-color: #ffffff;
            background-image: 
                linear-gradient(90deg, rgba(239, 68, 68, 0.15) 50%, transparent 50%),
                linear-gradient(rgba(239, 68, 68, 0.15) 50%, transparent 50%);
            background-size: 40px 40px;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
            position: relative;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            z-index: 1;
            margin-top: 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 2.5rem;
            background: rgba(255, 255, 255, 0.95);
            padding: 1.5rem 2rem;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(239, 68, 68, 0.15);
            border: 2px dashed rgba(239, 68, 68, 0.4);
            display: inline-block;
            margin-left: auto;
            margin-right: auto;
            width: 100%;
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 1rem;
            font-weight: 500;
        }

        .glass-panel {
            background: var(--card-bg);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 3px solid #ffffff;
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.08);
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 2.5rem;
            position: relative;
        }

        /* 装飾的なテープ風デザイン */
        .glass-panel::before {
            content: '';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%) rotate(-2deg);
            width: 120px;
            height: 35px;
            background: rgba(255, 255, 255, 0.7);
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            backdrop-filter: blur(4px);
            border: 1px solid rgba(0,0,0,0.05);
            z-index: 2;
        }

        @media (max-width: 768px) {
            .glass-panel {
                grid-template-columns: 1fr;
            }
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .field {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        label {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--text-main);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        label i {
            color: var(--primary);
        }

        input[type="text"],
        textarea {
            background: #ffffff;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 1rem;
            color: var(--text-main);
            font-family: inherit;
            font-size: 1rem;
            transition: all 0.3s ease;
            outline: none;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }

        input[type="text"]:focus,
        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.15);
        }

        textarea {
            resize: vertical;
            min-height: 250px;
        }

        button.primary-btn {
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            padding: 1rem 1.5rem;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            margin-top: 1rem;
            box-shadow: 0 6px 15px -5px rgba(239, 68, 68, 0.5);
        }

        button.primary-btn:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px -5px rgba(239, 68, 68, 0.6);
        }

        button.primary-btn:active {
            transform: translateY(0);
        }

        .output-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            height: 100%;
        }

        .output-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .copy-btn {
            background: #ffffff;
            border: 2px solid var(--border-color);
            color: var(--text-main);
            border-radius: 8px;
            padding: 0.5rem 1rem;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .copy-btn:hover {
            background: #fff5f5;
            border-color: var(--primary);
            color: var(--primary);
        }

        .result-box {
            background: #ffffff;
            border: 2px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            flex-grow: 1;
            min-height: 250px;
            white-space: pre-wrap;
            overflow-y: auto;
            color: var(--text-main);
            font-family: 'Inter', monospace;
            line-height: 1.6;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
        }
        
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-muted);
            text-align: center;
            gap: 1rem;
        }
        
        .empty-state i {
            font-size: 3rem;
            color: rgba(239, 68, 68, 0.3);
            margin-bottom: 0.5rem;
        }

    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1><i class="fa-solid fa-clock"></i> AI タイムスタンプ生成ツール</h1>
            <p class="subtitle">動画の文字起こしデータから、美しいタイムスタンプと要約を生成します</p>
        </header>

        <main class="glass-panel">
            <section class="input-group">
                <div class="field">
                    <label for="video-duration"><i class="fa-regular fa-clock"></i> 動画の時間（任意）</label>
                    <input type="text" id="video-duration" placeholder="例: 12:34">
                </div>
                
                <div class="field">
                    <label for="transcript"><i class="fa-solid fa-align-left"></i> 文字起こしデータ</label>
                    <textarea id="transcript" placeholder="ここに文字起こしデータを貼り付けてください..."></textarea>
                </div>

                <button class="primary-btn" id="generate-btn">
                    <i class="fa-solid fa-wand-magic-sparkles"></i> タイムスタンプを作成する
                </button>
            </section>

            <section class="output-group">
                <div class="output-header">
                    <label><i class="fa-solid fa-list-ul"></i> 生成結果</label>
                    <button class="copy-btn" id="copy-btn" title="クリップボードにコピー">
                        <i class="fa-regular fa-copy"></i> コピー
                    </button>
                </div>
                <div class="result-box" id="result-box">
                    <div class="empty-state">
                        <i class="fa-solid fa-hourglass-empty"></i>
                        <p>左側のフォームに文字起こしを入力し、<br>「作成する」をクリックするとここに結果が表示されます。</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        const generateBtn = document.getElementById('generate-btn');
        const copyBtn = document.getElementById('copy-btn');
        const resultBox = document.getElementById('result-box');
        
        generateBtn.addEventListener('click', () => {
            const transcript = document.getElementById('transcript').value.trim();
            const duration = document.getElementById('video-duration').value.trim();
            
            if (!transcript) {
                alert('文字起こしデータを入力してください。');
                return;
            }

            // ローディングUI
            const originalText = generateBtn.innerHTML;
            generateBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> 処理中...';
            generateBtn.disabled = true;

            // プロンプトを生成して結果領域に表示
            setTimeout(() => {
                const prompt = `以下の文字起こしデータから、YouTube概要欄にそのまま貼れる形式で「要約付きのタイムスタンプ」を作成してください。\n\n【指示】\n・「01:23 パートの要約タイトル」のように、タイムスタンプと要約タイトルを必ず1行にセットで書くこと\n・タイムスタンプは「1分12秒」ではなく、「01:12」や「23:23」のようなYouTubeでリンクになる形式（mm:ss）にすること\n・全体を5〜8個くらいに分けること\n・各パートの要約タイトルは初心者にもわかりやすく、クリックされやすい魅力的なものにすること\n\n【動画時間】\n${duration || "不明"}\n\n【文字起こしデータ】\n${transcript}`;
                
                resultBox.innerHTML = `<em>※以下のプロンプトをコピーしてChatGPTやGemini等に貼り付けると、指定の条件でタイムスタンプと概要欄テキストを生成してくれます。</em><br><br><hr><br>${prompt.replace(/\n/g, '<br>')}`;
                
                generateBtn.innerHTML = originalText;
                generateBtn.disabled = false;
            }, 800);
        });

        // コピー機能
        copyBtn.addEventListener('click', () => {
            const textToCopy = resultBox.innerText;
            if (textToCopy && !resultBox.querySelector('.empty-state')) {
                navigator.clipboard.writeText(textToCopy).then(() => {
                    const originalHTML = copyBtn.innerHTML;
                    copyBtn.innerHTML = '<i class="fa-solid fa-check"></i> コピー完了!';
                    copyBtn.style.color = '#10b981';
                    copyBtn.style.borderColor = '#10b981';
                    setTimeout(() => {
                        copyBtn.innerHTML = originalHTML;
                        copyBtn.style.color = '';
                        copyBtn.style.borderColor = '';
                    }, 2000);
                });
            }
        });
    </script>
</body>
</html>
